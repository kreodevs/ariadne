# Tests ingest (Vitest) y build del MCP. Dispara en cambios bajo services/ingest o services/mcp-ariadne.
name: Ingest & MCP

on:
  push:
    paths:
      - "services/ingest/**"
      - "services/mcp-ariadne/**"
      - "NOTICE"
      - "scripts/verify-archify-third-party.mjs"
      - "scripts/link.mjs"
      - ".github/workflows/ci-ingest-mcp.yml"
  pull_request:
    paths:
      - "services/ingest/**"
      - "services/mcp-ariadne/**"
      - "NOTICE"
      - "scripts/verify-archify-third-party.mjs"
      - "scripts/link.mjs"
      - ".github/workflows/ci-ingest-mcp.yml"

jobs:
  archify-third-party:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify Archify NOTICE + Dockerfile pin
        run: node scripts/verify-archify-third-party.mjs

  ingest-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build ariadne-common
        working-directory: packages/ariadne-common
        run: npm install && npm run build
      - run: npm install
      - run: npm test -- --run

  mcp-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp-ariadne
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # ariadne-common es file: dep; dist/ no está en el repo — hay que compilar antes del prepare del MCP.
      - name: Install and build ariadne-common
        working-directory: packages/ariadne-common
        run: npm install && npm run build
      - run: npm install
      # `build` = tsc + bundle de link (dist/link.mjs); falla si el bundle no compila.
      - run: npm run build
      # scripts/link.mjs (runner de `npx github:...`) se versiona: debe coincidir con el bundle de src/cli.ts.
      - name: Verificar scripts/link.mjs actualizado
        run: npm run check:link
